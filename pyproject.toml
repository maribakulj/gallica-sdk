[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gallica-sdk"
version = "0.2.0.dev0"
description = "A small, typed Python SDK for the public Gallica APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gallica"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: tests requiring public Gallica network access"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gallica"]
