[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gallica-sdk"
version = "0.2.0.dev0"
description = "Verified programmable reference and typed Python SDK for public Gallica services"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["gallica", "bnf", "digital-humanities", "iiif", "ocr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/maribakulj/gallica-sdk"
Source = "https://github.com/maribakulj/gallica-sdk"
Issues = "https://github.com/maribakulj/gallica-sdk/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gallica"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: tests requiring public Gallica network access"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gallica"]
