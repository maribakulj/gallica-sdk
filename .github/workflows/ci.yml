name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/gallica
      - run: pytest -m 'not live'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install build twine
      - run: python scripts/validate_release.py
      - run: python -m build
      - run: twine check dist/*
      - name: Install wheel in isolation
        run: |
          python -m venv /tmp/gallica-wheel
          /tmp/gallica-wheel/bin/python -m pip install dist/*.whl
          /tmp/gallica-wheel/bin/python -m pip check
          /tmp/gallica-wheel/bin/python -c "from importlib.metadata import version; from gallica import Gallica, __version__, programmable_reference; assert __version__ == version('gallica-sdk'); assert Gallica.capabilities(); assert programmable_reference()['schema_version']"
          /tmp/gallica-wheel/bin/gallica capabilities > /tmp/gallica-capabilities.json
          /tmp/gallica-wheel/bin/python -c "import json; data=json.load(open('/tmp/gallica-capabilities.json')); assert any(item['id']=='page_alto' for item in data)"
      - name: Install sdist in isolation
        run: |
          python -m venv /tmp/gallica-sdist
          /tmp/gallica-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/gallica-sdist/bin/python -m pip check
          /tmp/gallica-sdist/bin/python -c "from importlib.metadata import version; import gallica; assert gallica.__version__ == version('gallica-sdk')"
          /tmp/gallica-sdist/bin/gallica contract page_alto > /tmp/gallica-contract.json
          /tmp/gallica-sdist/bin/python -c "import json; data=json.load(open('/tmp/gallica-contract.json')); assert data['call']=='Page.alto'"

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[docs]'
      - run: python scripts/execute_notebooks.py

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -m live tests/test_live.py tests/test_live_usability.py
