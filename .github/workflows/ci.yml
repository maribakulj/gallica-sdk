name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/gallica
      - run: pytest -m 'not live'

  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_corpus.py tests/test_corpus_integrity.py tests/test_cli.py
      - run: gallica capabilities

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install build twine
      - run: python scripts/validate_release.py
      - run: python -m build
      - run: twine check dist/*
      - name: Install wheel in isolation
        run: |
          python -m venv /tmp/gallica-wheel
          /tmp/gallica-wheel/bin/python -m pip install dist/*.whl
          /tmp/gallica-wheel/bin/python -m pip check
          /tmp/gallica-wheel/bin/python -c "from importlib.metadata import version; from importlib.resources import files; from gallica import Gallica, __version__, programmable_reference; assert __version__ == version('gallica-sdk'); assert Gallica.capabilities(); assert programmable_reference()['schema_version']; assert (files('gallica') / 'py.typed').is_file()"
          /tmp/gallica-wheel/bin/gallica capabilities > /tmp/gallica-capabilities.json
          /tmp/gallica-wheel/bin/python -c "import json; data=json.load(open('/tmp/gallica-capabilities.json')); assert any(item['id']=='page_alto' for item in data)"
      - name: Install sdist in isolation
        run: |
          python -m venv /tmp/gallica-sdist
          /tmp/gallica-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/gallica-sdist/bin/python -m pip check
          /tmp/gallica-sdist/bin/python -c "from importlib.metadata import version; from importlib.resources import files; import gallica; assert gallica.__version__ == version('gallica-sdk'); assert (files('gallica') / 'py.typed').is_file()"
          /tmp/gallica-sdist/bin/gallica contract page_alto > /tmp/gallica-contract.json
          /tmp/gallica-sdist/bin/python -c "import json; data=json.load(open('/tmp/gallica-contract.json')); assert data['call']=='Page.alto'"

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[docs]'
      - run: python scripts/execute_notebooks.py

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -m live tests/test_live.py tests/test_live_usability.py
      - name: Generate evidence attestation
        run: python scripts/generate_evidence_attestation.py
      - name: Upload evidence attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallica-evidence-attestation-${{ github.sha }}
          path: evidence-attestation.json
          if-no-files-found: error
          retention-days: 30
