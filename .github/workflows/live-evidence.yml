name: Live evidence

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -m live tests/test_live.py tests/test_live_usability.py
      - name: Generate evidence attestation
        run: python scripts/generate_evidence_attestation.py
      - name: Upload evidence attestation
        uses: actions/upload-artifact@v4
        with:
          name: gallica-evidence-attestation-${{ github.sha }}
          path: evidence-attestation.json
          if-no-files-found: error
          retention-days: 30
