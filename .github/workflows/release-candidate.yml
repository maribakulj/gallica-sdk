name: Release candidate

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the validated candidate to TestPyPI
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install build twine
      - name: Validate project metadata
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python scripts/validate_release.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/validate_release.py --require-release
          fi
      - run: python -m build
      - run: twine check dist/*
      - name: Validate distribution license metadata
        run: python scripts/validate_distributions.py dist/*
      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/gallica-wheel
          /tmp/gallica-wheel/bin/python -m pip install --upgrade pip
          /tmp/gallica-wheel/bin/python -m pip install dist/*.whl
          /tmp/gallica-wheel/bin/python -m pip check
          /tmp/gallica-wheel/bin/python -c "from importlib.metadata import version; import gallica; assert gallica.__version__ == version('gallica-sdk')"
      - name: Install sdist in isolated environment
        run: |
          python -m venv /tmp/gallica-sdist
          /tmp/gallica-sdist/bin/python -m pip install --upgrade pip
          /tmp/gallica-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/gallica-sdist/bin/python -m pip check
          /tmp/gallica-sdist/bin/python -c "from importlib.metadata import version; import gallica; assert gallica.__version__ == version('gallica-sdk')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallica-sdk-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_testpypi &&
      github.ref == 'refs/heads/main' &&
      vars.TESTPYPI_PUBLISH_ENABLED == 'true'
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gallica-sdk
    permissions:
      id-token: write
    steps:
      - name: Download the exact validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gallica-sdk-dist
          path: dist
      - name: Publish validated distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
